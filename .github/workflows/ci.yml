# Runs the checks that were, until now, only ever run by hand on a laptop.
#
# Both sides are checked in separate jobs so a red backend still tells you
# whether the frontend is fine. Neither job needs a database, a browser or a
# secret: backend tests bring their own sqlite and set their own env in
# `tests/conftest.py`, and the frontend suite is jsdom-only.
#
# The formatter checks are here on purpose. Prettier and ruff-format both
# drifted red across ~40 untouched files between 2026-08-05 and 2026-08-18
# without anyone noticing, because nothing but a human ever looked.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest · ruff · mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Python version comes from backend/.python-version (3.12).
      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy app

      - name: Tests
        run: uv run pytest -q

  frontend:
    name: frontend (vitest · tsc · eslint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # vite 8 wants ^20.19 || >=22.12, vitest 4 wants ^20 || ^22 || >=24.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `postinstall` runs patch-package against patches/cubejs+1.3.2.patch.
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "tests/**/*.{ts,tsx}" "scripts/*.mjs"

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # `postbuild` enforces the 320 kB entry-chunk budget — that one is a gate.
      - name: Build
        run: npm run build
