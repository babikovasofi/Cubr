<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cubr — Stage 0 vision prototype</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Cubr vision prototype</h1>
        <p class="disclaimer">
          Throwaway Stage-0 rig. Reads a cube face by color and drives the hands
          state machine. Not the product UI.
        </p>
      </header>

      <section class="stage">
        <div class="video-wrap">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
        </div>
        <aside id="panel">
          <div class="row"><span>FSM state</span><b id="fsm-state">NO_HANDS</b></div>
          <div class="row"><span>Timer</span><b id="timer">0.000</b></div>
          <div class="row"><span>Sanity</span><b id="sanity">—</b></div>
          <div class="controls">
            <button id="btn-start" type="button">Start camera</button>
            <button id="btn-calibrate" type="button" disabled>Calibrate: capture face</button>
            <button id="btn-scramble" type="button" disabled>New scramble (reset cycle)</button>
            <button id="btn-read" type="button" disabled>Read face</button>
            <button id="btn-verify" type="button" disabled>Verify scramble (read 6)</button>
            <button id="btn-confirm" type="button" disabled>Confirm solved (read 6)</button>
            <button id="btn-accuracy" type="button" disabled>Run accuracy gate</button>
          </div>
        </aside>
      </section>

      <section class="output">
        <h2>Report</h2>
        <pre id="report">Start the camera to begin.</pre>
      </section>
    </main>
    <canvas id="work" hidden></canvas>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
