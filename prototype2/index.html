<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cubr — визуальный скрамбл (прототип)</title>
  </head>
  <body>
    <main id="app">
      <h1>Перемешай кубик по шагам</h1>

      <p id="orient-banner" class="banner">
        Возьми кубик <b>белой гранью вверх</b> и <b>зелёной к себе</b>.
        Дальше поворачивай только показанный слой — <b>не крути кубик целиком</b>.
      </p>

      <div id="player-slot" class="player"></div>

      <p id="status" class="status">Загрузка…</p>

      <div id="step-view" hidden>
        <p id="progress-text" class="progress-text"></p>
        <progress id="progress-bar" max="1" value="0"></progress>

        <p id="direction" class="direction"></p>

        <div class="controls">
          <button id="btn-prev" type="button">← назад</button>
          <button id="btn-next" type="button">дальше →</button>
        </div>
        <p class="hint">Клавиши: ← / → листают, Пробел — дальше.</p>

        <div class="toggle">
          <label><input type="checkbox" id="toggle-notation" /> показать нотацию (для опытных)</label>
        </div>
        <pre id="notation" class="notation" hidden></pre>

        <p class="map-label">Все ходы (текущий подсвечен, кликни чтобы прыгнуть):</p>
        <div id="minimap" class="minimap"></div>
      </div>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
